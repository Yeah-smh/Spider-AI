<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 中心圆点渐变 -->
    <radialGradient id="centerDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#A8E6CF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#88D8C0" stop-opacity="0.9"/>
    </radialGradient>
    
    <!-- 第一层涟漪渐变 -->
    <linearGradient id="ripple1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8E6CF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7DD3C0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#88D8C0" stop-opacity="0.8"/>
    </linearGradient>
    
    <!-- 第二层涟漪渐变 -->
    <linearGradient id="ripple2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88D8C0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#9DE5D8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B8F0E0" stop-opacity="0.45"/>
    </linearGradient>
    
    <!-- 第三层涟漪渐变 -->
    <linearGradient id="ripple3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8F0E0" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#C8F5EA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E0FAF5" stop-opacity="0.15"/>
    </linearGradient>
    
    <!-- 柔和光晕 -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>
  
  <!-- 第三层涟漪（最外层） -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#ripple3)" stroke-width="2.5" filter="url(#softBlur)"/>
  
  <!-- 第二层涟漪 -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="url(#ripple2)" stroke-width="2.5" filter="url(#softBlur)"/>
  
  <!-- 第一层涟漪 -->
  <circle cx="64" cy="64" r="20" fill="none" stroke="url(#ripple1)" stroke-width="2.5"/>
  
  <!-- 中心圆点 -->
  <circle cx="64" cy="64" r="8" fill="url(#centerDot)"/>
  
  <!-- 中心高光 -->
  <circle cx="62" cy="62" r="3" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>
